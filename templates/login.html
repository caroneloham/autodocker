<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Connexion - AutoDocker</title>
  <link rel="icon" href="/autodocker-logo.png" type="image/png">
  <script>
    (function(){var theme='light';try{if(localStorage.getItem('autodocker:theme')==='dark')theme='dark';}catch{}document.documentElement.dataset.theme=theme;})();
  </script>
  <link rel="stylesheet" href="/workspace.css">
  <style>
    body { min-height:100svh;display:grid;place-items:center;padding:32px 20px; }
    .login-shell { width:min(100%,420px);padding:0; }
    .login-shell .brand { margin-bottom:40px; }
    .login-shell h1 { margin-bottom:28px;font-size:28px;letter-spacing:-.8px; }
    .login-form { display:grid;gap:20px; }
    .login-field label { display:block;margin-bottom:8px;font-size:14px;font-weight:500; }
    .login-field input { width:100%;min-height:48px;padding:11px 13px;border:1px solid var(--line);border-radius:7px;background:var(--surface-input);color:var(--text); }
    .login-form .button { width:100%;justify-content:center;margin-top:4px; }
    .login-shell .error-box { margin:0 0 24px; }
  </style>
</head>
<body>
  <main class="login-shell">
    <a class="brand" href="/" aria-label="AutoDocker, accueil"><span class="autodocker-logo" aria-hidden="true"><img src="/autodocker-logo.png" alt="" draggable="false"></span><span>AutoDocker</span></a>
    <h1>Connexion</h1>
    {{if .Error}}<p class="error-box" role="alert">{{.Error}}</p>{{end}}
    <form class="login-form" method="post" action="/login">
      {{if .TOTPStep}}
      <input type="hidden" name="totp_step" value="1">
      <div class="login-field"><label for="totp-code">Code de vérification</label><input id="totp-code" name="totp_code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus></div>
      {{else}}
      <div class="login-field"><label for="access-username">Identifiant</label><input id="access-username" type="text" name="username" value="{{.Username}}" maxlength="32" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></div>
      <div class="login-field"><label for="access-password">Mot de passe</label><input id="access-password" type="password" name="password" required autocomplete="current-password"></div>
      {{end}}
      <button class="button primary" type="submit">Se connecter</button>
    </form>
  </main>
</body>
</html>
